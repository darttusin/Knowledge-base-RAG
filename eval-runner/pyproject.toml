[project]
name = "eval-runner"
version = "0.1.0"
requires-python = ">=3.12"
# Reuses the runtime rag/ module (workspace dep) so retriever logic,
# chains, prompts, and the RAGAS subprocess venv setup don't get
# duplicated. Adds wandb tracking + an end-to-end runner that loops
# over an eval split. RunConfig alone is not complete experiment provenance.
dependencies = [
    "rag",
    "wandb>=0.18.0,<1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.3",
    "openai>=1.0.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_runner"]

[project]
name = "lora-pipeline"
version = "0.1.0"
# Matches lora-train: this orchestrator runs on the GPU box for a full run.
# Stages import their heavy dependencies lazily, so `--skip-train` works in
# an environment without the CUDA training stack.
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "openai>=1.0.0",
    "prompt-contract",
    "rag",
    "dataset-synth",
]

# The CUDA training stack is optional so the ingest and synth stages can be
# installed on a laptop without pulling torch/peft/trl.
[project.optional-dependencies]
train = ["lora-train"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lora_pipeline"]

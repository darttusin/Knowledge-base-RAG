[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.3.0",
    "langchain-core>=1.2.28",
    "langchain-text-splitters>=0.3.0",
    "numpy>=2.0.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "pydantic-settings>=2.11.0",
    "sentence-transformers>=3.0.0",
    "tqdm>=4.0.0",
    "wandb>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

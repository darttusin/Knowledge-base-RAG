[project]
name = "outlier-detection"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "scikit-learn>=1.6.0",
    "joblib>=1.4.0",
    "numpy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]

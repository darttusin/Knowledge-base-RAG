[project]
name = "dataset-synth"
version = "0.1.0"
requires-python = ">=3.12"
# Requests synthetic Q&A from ChromaDB chunks through an OpenAI-compatible
# teacher endpoint. The prompt asks for grounding, but code validates only
# response structure; quality/groundedness require a separate evaluation.
dependencies = [
    "prompt-contract",
    "chromadb>=1.3.0",
    "openai>=1.0.0",
    "loguru>=0.7.3",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dataset_synth"]

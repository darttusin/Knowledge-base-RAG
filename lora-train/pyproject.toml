[project]
name = "lora-train"
version = "0.1.0"
# Package metadata permits standalone Python 3.12, while the repository-level
# uv workspace and canonical lock currently require Python 3.13.
requires-python = ">=3.12"
# NOTE: real training is supported only on a suitable Linux/CUDA host; the
# stack is not validated as a macOS/CPU training path.
#
# Upper bounds describe the currently constrained API window. Do not loosen
# them without resolving the workspace lock and running a CUDA smoke.
dependencies = [
    "torch>=2.5,<2.8",
    "transformers>=4.46,<5",
    "peft>=0.13,<0.20",
    "bitsandbytes>=0.44,<0.50; platform_system != 'Darwin'",
    "trl>=0.12,<1.0",
    "accelerate>=1.0,<2.0",
    "datasets>=3.0,<4.0",
    "loguru>=0.7.3",
    "wandb>=0.18.0,<1.0",
    "huggingface-hub>=0.21.0",
    "prompt-contract",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lora_train"]

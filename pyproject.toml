[project]
name = "knowledge-base-rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "torch-parser",
    "tgbot",
    "backend",
    "code-executor",
    "rag",
    "outlier-detection",
    "dataset-prep",
    "lora-train",
    "eval-runner",
]

[tool.uv.sources]
torch-parser = { workspace = true }
rag = { workspace = true }
outlier-detection = { workspace = true }
dataset-prep = { workspace = true }
lora-train = { workspace = true }
eval-runner = { workspace = true }

[tool.ruff.lint]
select = ["F", "E", "W", "C90", "I", "S", "BLE", "T20", "ARG", "ERA", "PLR0913"]
ignore = ["E501", "S104", "C901", "BLE001"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG"]
"scripts/extract_module_templates.py" = ["E402"]
"scripts/extract_schemas.py" = ["E402"]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "passlib>=1.7.4",
    "pyright>=1.1.408",
    "ruff>=0.13.3",
]


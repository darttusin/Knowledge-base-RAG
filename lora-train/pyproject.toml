[project]
name = "lora-train"
version = "0.1.0"
requires-python = ">=3.13"
# NOTE: this module is CUDA + Linux only. Install on the vast.ai server,
# not on macOS/CPU. bitsandbytes has no macOS wheel; torch wheel must
# match the CUDA version of the rented GPU.
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0; platform_system != 'Darwin'",
    "trl>=0.12.0",
    "accelerate>=1.0.0",
    "datasets>=3.0.0",
    "loguru>=0.7.3",
    "wandb>=0.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lora_train"]

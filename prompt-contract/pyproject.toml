[project]
name = "prompt-contract"
version = "0.1.0"
# Deliberately stdlib-only and 3.12-compatible: every stage depends on this
# package, including `lora-train` which is installed on bare GPU boxes.
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompt_contract"]

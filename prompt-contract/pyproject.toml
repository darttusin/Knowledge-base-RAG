[project]
name = "prompt-contract"
version = "0.1.0"
# Deliberately stdlib-only and standalone-compatible with Python 3.12. The root
# uv workspace and its canonical lock currently require Python 3.13.
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompt_contract"]
